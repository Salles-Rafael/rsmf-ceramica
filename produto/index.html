<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSMF Cerâmica · peça</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#151309;--card:#1d1b14;--text:#f2efe7;--muted:#bbb7ae;--line:#514d42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:26px 6%;border-bottom:1px solid var(--line);font-weight:800;font-size:30px}
header a{color:inherit;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:28px 6% 60px}
.back{color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:24px}
.product{display:grid;grid-template-columns:1.05fr .95fr;gap:38px}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:#29271f}
.kicker{letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-size:13px}
h1{font-family:Georgia,serif;font-size:52px;line-height:1;margin:12px 0}.price{font-size:27px;margin:18px 0}
.desc{color:var(--muted);font-size:18px;line-height:1.65}.specs{border-top:1px solid var(--line);margin-top:28px;padding-top:8px}
.spec{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.btn{display:block;margin-top:28px;padding:18px 22px;border:1px solid var(--line);border-radius:40px;text-align:center;color:var(--text);text-decoration:none;font-weight:800;font-size:18px}
.status{color:var(--muted)}.shipping{margin-top:28px;padding:20px;border:1px solid var(--line);background:#f8f5ee}.shipping h2{font-family:Georgia,serif;font-size:25px;margin:0 0 8px}.shipping p{color:var(--muted);font-size:14px;line-height:1.5}.shiprow{display:flex;gap:8px}.shiprow input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);background:#fff;font:inherit}.shiprow button{padding:14px 18px;border:0;background:#4c5740;color:#fff;font-weight:700;cursor:pointer}.shipresult{margin-top:14px}.shipoption{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.shipoption span{color:var(--muted)}.shiperror{color:#a34b3f;font-size:14px;margin-top:12px}#error{padding:40px 0;color:var(--muted)}
@media(max-width:700px){.product{grid-template-columns:1fr;gap:24px}h1{font-size:42px}.wrap{padding-left:6%;padding-right:6%}}


/* RSMF Cerâmica — identidade editorial 2026 */
:root{--bg:#f2eee5;--ink:#242820;--muted:#706c61;--terracotta:#a76b47;--cobalt:#384d60;--ochre:#b89965;--sage:#535e45;--paper:#f7f3e9;--line:#d7d0c2;--card:#faf7f0}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;letter-spacing:.005em}
h1,h2,h3,.quote{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.045em}
.nav{background:#f8f5ee!important;border-bottom:1px solid #d8d0c2!important;box-shadow:none!important}
.logo{font-family:Georgia,serif!important;font-weight:400!important;letter-spacing:-.055em!important;font-size:clamp(24px,3vw,36px)!important}
.navlinks a{letter-spacing:.1em;text-transform:uppercase;font-size:11px!important}
.hero{background:#e9e5d9!important;color:#22281e!important;position:relative;overflow:hidden}
.hero h1{font-size:clamp(60px,9vw,130px)!important;line-height:.96!important;max-width:850px}
.hero .kicker,.section .kicker,.eyebrow{letter-spacing:.23em!important;text-transform:uppercase!important;font-size:11px!important;color:#8c674a!important}
.hero p{max-width:550px;line-height:1.7!important}
.cta,.buy{background:#4c5740!important;color:#fff!important;border-radius:2px!important;letter-spacing:.08em!important;text-transform:uppercase!important;font-size:12px!important;padding:17px 24px!important;transition:background .2s ease,transform .2s ease}
.cta:hover,.buy:hover{background:#a56a49!important;transform:translateY(-2px)}
.heroart{filter:saturate(.7);opacity:.84}
.section{background:#f5f1e9!important}.section h2{font-size:clamp(43px,6vw,82px)!important;line-height:1.04!important}
.grid{gap:22px!important}.product{background:#fbf8f2!important;border:1px solid #d8d0c2!important;box-shadow:none!important;padding-bottom:14px!important}
.product .photo{background:#e9e3d7!important;overflow:hidden}.product .photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}.product:hover .photo img{transform:scale(1.035)}
.product h3{font-size:clamp(24px,2.6vw,33px)!important}.product .price{color:#625e55!important}
.about{background:#e4e3d8!important}.quote{font-style:italic;color:#4d5a43!important}
.insta{background:#454f3e!important;color:#f7f3e9!important}.insta .cta{background:#f1e7d4!important;color:#263026!important}
.footer{background:#252a24!important;color:#f2eee5!important}
@media(max-width:700px){.hero h1{font-size:clamp(55px,14vw,84px)!important}.hero{padding-top:50px!important}.navlinks{gap:12px!important}.section{padding-top:64px!important;padding-bottom:64px!important}}
</style></head><body>
<header><a href="/">RSMF Cerâmica</a></header>
<main class="wrap"><a class="back" href="/#colecao">← Voltar para a coleção</a>
<div id="error">Carregando peça...</div>
<section id="product" class="product" hidden>
<img id="photo" class="photo" alt="">
<div><div class="kicker" id="code"></div><h1 id="name"></h1><div class="price" id="price"></div>
<div class="status" id="status"></div><p class="desc" id="description"></p>
<div class="specs" id="specs"></div>
<div class="shipping"><h2>Calcular frete</h2><p>Informe o CEP de entrega para consultar PAC e SEDEX.</p><div class="shiprow"><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" aria-label="CEP de entrega"><button id="calcFrete" type="button">Calcular</button></div><div id="shipResult" class="shipresult"></div></div>
<a id="interest" class="btn" href="#">Quero este vaso</a></div></section></main>
<script>
const SUPABASE_URL='https://cmzeojsbqrckvrcdhgqz.supabase.co';
const SUPABASE_KEY='sb_publishable_yd_g8vW-7zMLNsh_NA0Ivg_Iqz2C_gg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const q=new URLSearchParams(location.search), slug=q.get('slug'), id=q.get('id');
async function load(){
 let query=sb.from('products').select('*');
 if(slug) query=query.eq('slug',slug); else if(id) query=query.eq('id',id); else {document.getElementById('error').textContent='Peça não encontrada.';return}
 const {data:p,error}=await query.single();
 if(error||!p){document.getElementById('error').textContent='Esta peça não está disponível.';return}
 document.title=p.name+' · RSMF Cerâmica'; photo.src=p.cover_image_url||'';photo.alt=p.name||'Peça RSMF Cerâmica';
 code.textContent=p.code?'RSMF Cerâmica · '+p.code:'RSMF Cerâmica';name.textContent=p.name||'Peça sem nome';
 price.textContent=Number(p.price||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 status.textContent=(p.stock>0&&p.status==='available')?'Disponível':'Indisponível';
 description.textContent=p.description||'Peça autoral em cerâmica.';
 const vals=[['Altura',p.height_cm?p.height_cm+' cm':''],['Diâmetro',p.diameter_cm?p.diameter_cm+' cm':''],['Cor',p.color||''],['Acabamento',p.finish||''],['Coleção',p.collection||''],['Edição',p.edition||'']];
 specs.innerHTML=vals.filter(x=>x[1]).map(x=>'<div class="spec"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');
 const msg=encodeURIComponent('Olá! Tenho interesse na peça '+(p.name||'')+(p.code?' ('+p.code+')':'')+' da RSMF Cerâmica.');
 interest.href='https://www.instagram.com/rsmf.ceramica/'; interest.target='_blank';
 document.getElementById('error').hidden=true;document.getElementById('product').hidden=false;
}
const FRETE_API='https://rsmf-api.rsmfreire.workers.dev/frete';
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function maskCep(v){v=v.replace(/\D/g,'').slice(0,8);return v.length>5?v.slice(0,5)+'-'+v.slice(5):v}
document.getElementById('cep').addEventListener('input',e=>e.target.value=maskCep(e.target.value));
document.getElementById('calcFrete').onclick=async()=>{
 const cep=document.getElementById('cep').value.replace(/\D/g,'');
 const out=document.getElementById('shipResult');
 if(cep.length!==8){out.innerHTML='<div class="shiperror">Informe um CEP válido com 8 dígitos.</div>';return}
 out.textContent='Calculando...';
 try{
  const r=await fetch(FRETE_API+'?cep='+encodeURIComponent(cep));
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||'Não foi possível calcular o frete.');
  const ok=(Array.isArray(data)?data:[]).filter(x=>x && !x.error && x.price);
  if(!ok.length){out.innerHTML='<div class="shiperror">Nenhuma opção de frete disponível para este CEP.</div>';return}
  out.innerHTML=ok.map(x=>'<div class="shipoption"><div><strong>'+String(x.name||'Frete')+'</strong><br><span>'+(x.delivery_range?x.delivery_range.min+' a '+x.delivery_range.max+' dias úteis':(x.delivery_time?x.delivery_time+' dias úteis':''))+'</span></div><strong>'+brl(x.price)+'</strong></div>').join('');
 }catch(e){out.innerHTML='<div class="shiperror">Não foi possível consultar o frete agora.</div>'}
};
load();
</script></body></html>
