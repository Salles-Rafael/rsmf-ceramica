<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RSMF Cerâmica · peça</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f0e8;--paper:#faf7f0;--ink:#25291f;--muted:#706c61;--line:#d4cbbb;--green:#394737;--max:1180px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:10;background:rgba(248,245,239,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.navin{max-width:var(--max);margin:auto;padding:15px 22px;display:flex;align-items:center}.logo{font:400 clamp(23px,2.7vw,33px) Georgia,serif}.cartlink{margin-left:auto;position:relative;display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%}.cartlink svg{width:20px}.cartcount{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--green);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}.wrap{max-width:var(--max);margin:auto;padding:28px 22px 70px}.back{color:var(--muted);display:inline-block;margin:4px 0 24px;font-size:14px}.product{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:clamp(30px,5vw,68px);align-items:start}.photo-wrap{background:#e9e3d7;min-width:0}.photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-height:760px}.info{padding-top:8px}.kicker{letter-spacing:.2em;text-transform:uppercase;color:#8c674a;font-size:10px;font-weight:700}h1{font:400 clamp(42px,5.5vw,72px)/.98 Georgia,serif;letter-spacing:-.045em;margin:14px 0 16px}.price{font-size:26px;margin:16px 0 8px}.status{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.desc{color:var(--muted);font-size:17px;line-height:1.65}.specs{border-top:1px solid var(--line);margin-top:24px}.spec{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}.spec strong{color:var(--ink);font-weight:500}.shipping{margin-top:26px;padding:18px;border:1px solid var(--line);background:var(--paper)}.shipping h2{font:400 24px Georgia,serif;margin:0 0 7px}.shipping p{color:var(--muted);font-size:13px;line-height:1.5}.shiprow{display:flex;gap:8px}.shiprow input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);background:#fff;font:inherit}.shiprow button,.btn{border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.shiprow button{padding:13px 16px}.shipresult{margin-top:12px}.shipoption{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}.shipoption span{color:var(--muted)}.shiperror{color:#9b443b;font-size:13px;margin-top:10px}.btn{display:block;width:100%;margin-top:22px;padding:17px;text-align:center;text-transform:uppercase;letter-spacing:.1em;font-size:11px}.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}.cartnote{min-height:18px;margin-top:10px;color:var(--muted);font-size:13px;text-align:center}#error{padding:50px 0;color:var(--muted)}
@media(max-width:760px){.navin{padding:12px 16px}.wrap{padding:20px 16px 54px}.product{grid-template-columns:1fr;gap:26px}.photo{aspect-ratio:4/5;max-height:none}h1{font-size:clamp(40px,12vw,58px)}.info{padding:0}.shipping{padding:16px}.shiprow{flex-wrap:wrap}.shiprow button{width:100%}}
</style><style>.shiprow,.shipresult{display:none!important}</style></head><body><header class="nav"><div class="navin"><a class="logo" href="/">RSMF Cerâmica</a><a class="cartlink" href="/carrinho/" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.5 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cartcount" id="cartCount">0</span></a></div></header><main class="wrap"><a class="back" href="/#colecao">← Voltar para a coleção</a><div id="error">Carregando peça...</div><section id="product" class="product" hidden><div class="photo-wrap"><img id="photo" class="photo" alt=""></div><div class="info"><div class="kicker" id="code"></div><h1 id="name"></h1><div class="price" id="price"></div><div class="status" id="status"></div><section class="shipping" aria-label="Descrição da peça"><h2>Sobre a peça</h2><p class="desc" id="description"></p></section><div class="specs" id="specs"></div><a id="interest" class="btn" href="#">Adicionar ao carrinho</a><div id="cartNote" class="cartnote"></div></div></section></main><script>
const SUPABASE_URL='https://cmzeojsbqrckvrcdhgqz.supabase.co',SUPABASE_KEY='sb_publishable_yd_g8vW-7zMLNsh_NA0Ivg_Iqz2C_gg',CART_KEY='rsmf_cart',FRETE_API='https://rsmf-api.rsmfreire.workers.dev/frete';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const q=new URLSearchParams(location.search),slug=q.get('slug'),id=q.get('id');let currentProduct=null;
function getCart(){try{const x=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartCount()}function updateCartCount(){const n=getCart().reduce((s,x)=>s+Math.max(0,Number(x.quantity||0)),0);cartCount.textContent=n;cartCount.style.display=n?'grid':'none'}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function load(){let query=sb.from('products').select('*');if(slug)query=query.eq('slug',slug);else if(id)query=query.eq('id',id);else{error.textContent='Peça não encontrada.';return}const{data:p,error:e}=await query.single();if(e||!p){error.textContent='Esta peça não está disponível.';return}currentProduct=p;document.title=(p.name||'Peça')+' · RSMF Cerâmica';photo.src=p.cover_image_url||'';photo.alt=p.name||'Peça RSMF Cerâmica';code.textContent=p.code?'RSMF Cerâmica · '+p.code:'RSMF Cerâmica';name.textContent=p.name||'Peça sem nome';price.textContent=brl(p.price);const available=p.status==='available'&&Number(p.stock)>0;status.textContent=available?Number(p.stock)+' em estoque':'Indisponível';description.textContent=p.description||'Peça autoral em cerâmica.';const vals=[['Altura',p.height_cm?p.height_cm+' cm':''],['Diâmetro',p.diameter_cm?p.diameter_cm+' cm':''],['Cor',p.color||''],['Acabamento',p.finish||''],['Coleção',p.collection||''],['Edição',p.edition||'']];specs.innerHTML=vals.filter(x=>x[1]).map(x=>'<div class="spec"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');interest.setAttribute('aria-disabled',available?'false':'true');interest.textContent=available?'Adicionar ao carrinho':'Indisponível';error.hidden=true;product.hidden=false;updateCartNote()}
function sameItem(a,p){return String(a.id)===String(p.id)||(a.slug&&p.slug&&a.slug===p.slug)}function updateCartNote(){if(!currentProduct)return;const item=getCart().find(x=>sameItem(x,currentProduct));cartNote.textContent=item?item.quantity+' unidade(s) desta peça no carrinho':''}
interest.addEventListener('click',e=>{e.preventDefault();if(!currentProduct||currentProduct.status!=='available'||Number(currentProduct.stock)<=0)return;const cart=getCart(),i=cart.findIndex(x=>sameItem(x,currentProduct)),max=Number(currentProduct.stock||0);if(i>=0){const qty=Number(cart[i].quantity||1);if(qty>=max){cartNote.textContent='Você já atingiu o estoque disponível desta peça.';return}cart[i].quantity=qty+1;cart[i].stock=max;cart[i].price=Number(currentProduct.price||0);cart[i].image=currentProduct.cover_image_url||cart[i].image||''}else{cart.push({id:currentProduct.id,slug:currentProduct.slug,name:currentProduct.name,price:Number(currentProduct.price||0),image:currentProduct.cover_image_url||'',quantity:1,stock:max})}saveCart(cart);location.href='/carrinho/'});
updateCartCount();load();
</script></body></html>
