<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento · RSMF Cerâmica</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#f5f3ee;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  padding:24px 20px;
  border-bottom:1px solid #333;
}

header a{
  color:#f5f3ee;
  text-decoration:none;
  font-size:14px;
}

main{
  width:min(680px,calc(100% - 32px));
  margin:40px auto 70px;
}

h1{
  margin:0 0 10px;
  font-size:32px;
}

.intro{
  color:#aaa;
  line-height:1.5;
  margin-bottom:28px;
}

.card{
  border:1px solid #2d2d2d;
  background:#0d0d0d;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 18px;
  font-size:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  color:#bbb;
}

.row strong{
  color:#f5f3ee;
}

.total{
  margin-top:10px;
  padding-top:18px;
  border-top:1px solid #333;
  font-size:20px;
}

.total strong{
  font-size:24px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px 18px;
  background:#f5f3ee;
  color:#090909;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:wait;
}

#message{
  margin-top:14px;
  color:#bbb;
  line-height:1.5;
}

#pixResult{
  display:none;
  margin-top:22px;
  text-align:center;
}

#qrImage{
  display:block;
  width:240px;
  max-width:100%;
  margin:18px auto;
  background:#fff;
  padding:12px;
  border-radius:12px;
}

.pix-label{
  text-align:left;
  font-size:14px;
  color:#aaa;
  margin:18px 0 8px;
}

#pixCode{
  width:100%;
  min-height:110px;
  resize:none;
  border:1px solid #333;
  border-radius:12px;
  padding:13px;
  background:#050505;
  color:#f5f3ee;
  font-size:13px;
  line-height:1.45;
}

.copy{
  margin-top:10px;
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.expiration{
  margin-top:14px;
  color:#999;
  font-size:13px;
}

.sandbox{
  margin-top:18px;
  padding:12px;
  border:1px solid #4d4322;
  border-radius:10px;
  color:#d8c780;
  background:#171407;
  font-size:13px;
  line-height:1.4;
}
</style>
</head>

<body>

<header>
  <a href="/entrega/">← Voltar para entrega</a>
</header>

<main>
  <h1>Pagamento</h1>

  <p class="intro">
    Confira o seu pedido. O pagamento será realizado via Pix.
  </p>

  <section class="card">
    <h2>Resumo do pedido</h2>

    <div class="row">
      <span>Produto</span>
      <strong id="subtotal">—</strong>
    </div>

    <div class="row">
      <span id="shippingName">Frete</span>
      <strong id="shippingPrice">—</strong>
    </div>

    <div class="row total">
      <span>Total</span>
      <strong id="total">—</strong>
    </div>
  </section>

  <section class="card">
    <h2>Pagamento via Pix</h2>

    <p class="intro">
      Gere o QR Code Pix para concluir o pagamento.
    </p>

    <button id="generatePix">
      Gerar Pix
    </button>

    <div id="message"></div>

    <div id="pixResult">
      <img id="qrImage" alt="QR Code Pix">

      <div class="pix-label">
        Pix Copia e Cola
      </div>

      <textarea
        id="pixCode"
        readonly
      ></textarea>

      <button
        id="copyPix"
        class="copy"
        type="button"
      >
        Copiar código Pix
      </button>

      <div
        id="expiration"
        class="expiration"
      ></div>
    </div>

    <div class="sandbox">
      Pagamento seguro via Pix.
      O pagamento será processado pelo PagBank.
    </div>
  </section>
</main>

<script>
const CHECKOUT_KEY = "rsmf_checkout";
const CART_KEY = "rsmf_cart";

const PIX_API =
  "https://rsmf-pagbank.rsmfreire.workers.dev/pix";

const checkoutRaw =
  localStorage.getItem(CHECKOUT_KEY);

if (!checkoutRaw) {
  window.location.href = "/carrinho/";
}

let checkout;

try {
  checkout = JSON.parse(checkoutRaw);
} catch {
  localStorage.removeItem(CHECKOUT_KEY);
  window.location.href = "/carrinho/";
}

const money = value =>
  Number(value || 0).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

document.getElementById("subtotal").textContent =
  money(checkout.subtotal);

document.getElementById("shippingName").textContent =
  checkout.shipping?.name
    ? `Frete · ${checkout.shipping.name}`
    : "Frete";

document.getElementById("shippingPrice").textContent =
  money(checkout.shipping?.price);

document.getElementById("total").textContent =
  money(checkout.total);

const generateButton =
  document.getElementById("generatePix");

const message =
  document.getElementById("message");

const pixResult =
  document.getElementById("pixResult");

const qrImage =
  document.getElementById("qrImage");

const pixCode =
  document.getElementById("pixCode");

const expiration =
  document.getElementById("expiration");

generateButton.addEventListener(
  "click",
  async () => {
    generateButton.disabled = true;
    generateButton.textContent =
      "Gerando Pix...";

    message.textContent =
      "Conectando ao PagBank...";

    pixResult.style.display = "none";

    try {
      const response = await fetch(
        PIX_API,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            checkout,
            cart:JSON.parse(localStorage.getItem(CART_KEY)||"[]")
          })
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          (data.error || "Erro Pix") + " | HTTP " + response.status + " | " + (data.details?.error_messages || data.details?.message || data.details?.error || []).toString() ||
          "Não foi possível gerar o Pix."
        );
      }

      if (!data.pix?.text) {
        throw new Error(
          "O PagBank não retornou o código Pix."
        );
      }

      pixCode.value = data.pix.text;

      if (data.pix.image) {
        qrImage.src = data.pix.image;
        qrImage.style.display = "block";
      } else {
        qrImage.style.display = "none";
      }

      if (data.expiration_date) {
        const date =
          new Date(data.expiration_date);

        expiration.textContent =
          "Pix válido até " +
          date.toLocaleString("pt-BR");
      } else {
        expiration.textContent = "";
      }

      pixResult.style.display = "block";

      message.textContent =
        "Pix gerado com sucesso.";

      generateButton.textContent =
        "Gerar novo Pix";

    } catch (error) {
      message.textContent =
        "Erro: " + error.message;

      generateButton.textContent =
        "Tentar novamente";
    } finally {
      generateButton.disabled = false;
    }
  }
);

document.getElementById("copyPix")
  .addEventListener(
    "click",
    async () => {
      try {
        await navigator.clipboard.writeText(
          pixCode.value
        );

        const button =
          document.getElementById("copyPix");

        button.textContent =
          "Código Pix copiado";

        setTimeout(() => {
          button.textContent =
            "Copiar código Pix";
        }, 2000);

      } catch {
        pixCode.select();
        document.execCommand("copy");
      }
    }
  );
</script>

</body>
</html>
