<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrinho · RSMF Cerâmica</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f4f0e8;--paper:#faf7f0;--ink:#25291f;--muted:#706c61;--line:#d4cbbb;--green:#394737;--danger:#934b40;--max:980px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}a{color:inherit}.nav{border-bottom:1px solid var(--line);background:#f8f5ef}.navin{max-width:var(--max);margin:auto;padding:15px 22px;display:flex;align-items:center;gap:20px}.logo{font:400 clamp(23px,2.7vw,33px) Georgia,serif;text-decoration:none}.continue{margin-left:auto;color:var(--muted);font-size:13px}.cartpill{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.wrap{max-width:var(--max);margin:auto;padding:42px 22px 80px}h1{font:400 clamp(42px,6vw,68px)/1 Georgia,serif;letter-spacing:-.045em;margin:0 0 12px}.lead{color:var(--muted);margin:0 0 34px}.item{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:22px;align-items:center;padding:20px 0;border-top:1px solid var(--line)}.item:last-child{border-bottom:1px solid var(--line)}.item img{width:130px;height:150px;object-fit:cover;background:#e9e3d7}.item h2{font:400 26px Georgia,serif;margin:0 0 7px}.unit{color:var(--muted);font-size:14px}.lineprice{font-weight:700;margin-top:7px}.stocknote{color:var(--muted);font-size:12px;margin-top:7px}.controls{display:flex;align-items:center;gap:8px}.qtybtn{width:38px;height:38px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:19px}.qtybtn:disabled{opacity:.35}.qty{min-width:28px;text-align:center;font-weight:700}.remove{display:block;margin-top:12px;margin-left:auto;border:0;background:none;color:var(--danger);text-decoration:underline;font-size:12px;padding:0}.summary{max-width:440px;margin:32px 0 0 auto;background:var(--paper);border:1px solid var(--line);padding:24px}.total{display:flex;justify-content:space-between;gap:20px;font-size:22px;font-weight:700;margin-bottom:18px}.checkout{display:block;background:var(--green);color:#fff;text-decoration:none;text-align:center;padding:17px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}.checkout.disabled{opacity:.45;pointer-events:none}.syncmsg{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}.empty{display:none;padding:42px 0}.empty a{display:inline-block;margin-top:12px;background:var(--green);color:#fff;text-decoration:none;padding:14px 18px}.warning{background:#f2e5df;border:1px solid #d9b8ac;padding:12px 14px;margin:0 0 20px;color:#78463c;font-size:13px;line-height:1.5}
@media(max-width:650px){.navin{padding:12px 16px}.continue{font-size:0}.continue:after{content:'Loja';font-size:13px}.wrap{padding:34px 16px 60px}.item{grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:start}.item img{width:92px;height:112px}.item h2{font-size:22px}.controls-wrap{grid-column:2}.controls{justify-content:flex-start}.remove{margin-left:0}.summary{max-width:none;margin-top:26px}.lead{margin-bottom:26px}}
</style></head><body><header class="nav"><div class="navin"><a class="logo" href="/">RSMF Cerâmica</a><a class="continue" href="/#colecao">Continuar comprando</a><span class="cartpill" id="cartPill">0 itens</span></div></header><main class="wrap"><h1>Seu carrinho</h1><p class="lead">As unidades do mesmo produto ficam agrupadas e respeitam o estoque disponível.</p><div id="warning"></div><div id="items"></div><div id="empty" class="empty"><p>Seu carrinho está vazio.</p><a href="/#colecao">Ver peças disponíveis</a></div><div class="summary" id="summary"><div class="total"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div><a class="checkout" href="/entrega/" id="checkout">Continuar para entrega</a><div class="syncmsg">O estoque é conferido com a loja antes de seguir para a entrega.</div></div></main><script>
const CART_KEY='rsmf_cart',SUPABASE_URL='https://cmzeojsbqrckvrcdhgqz.supabase.co',SUPABASE_KEY='sb_publishable_yd_g8vW-7zMLNsh_NA0Ivg_Iqz2C_gg';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let stockMap=new Map();function getCart(){try{const x=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c))}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function keyOf(x){return x.id!=null?'id:'+x.id:'slug:'+x.slug}
function normalizeCart(cart){const map=new Map();for(const raw of cart){if(!raw||raw.id==null&&!raw.slug)continue;const k=keyOf(raw),q=Math.max(1,Number(raw.quantity||1));if(map.has(k))map.get(k).quantity+=q;else map.set(k,{...raw,quantity:q})}return[...map.values()]}
async function syncStock(){let cart=normalizeCart(getCart());if(!cart.length){saveCart([]);render();return}const ids=cart.map(x=>x.id).filter(x=>x!=null);let data=[];if(ids.length){const res=await sb.from('products').select('id,slug,name,price,cover_image_url,stock,status').in('id',ids);if(!res.error)data=res.data||[]}stockMap=new Map(data.map(p=>[String(p.id),p]));let changed=false,removed=0;const next=[];for(const item of cart){const p=item.id!=null?stockMap.get(String(item.id)):null;if(!p){next.push(item);continue}const max=p.status==='available'?Math.max(0,Number(p.stock||0)):0;if(max<1){removed++;changed=true;continue}const qty=Math.min(Math.max(1,Number(item.quantity||1)),max);if(qty!==Number(item.quantity)||Number(item.stock)!==max||Number(item.price)!==Number(p.price))changed=true;next.push({...item,slug:p.slug||item.slug,name:p.name||item.name,price:Number(p.price||0),image:p.cover_image_url||item.image||'',quantity:qty,stock:max})}if(changed||next.length!==cart.length)saveCart(next);warning.innerHTML=removed?'<div class="warning">Uma peça foi retirada do carrinho porque não está mais disponível.</div>':'';render()}
function maxFor(item){const p=item.id!=null?stockMap.get(String(item.id)):null;return p?Math.max(0,Number(p.stock||0)):Math.max(1,Number(item.stock||1))}function changeQuantity(index,change){const cart=normalizeCart(getCart()),item=cart[index];if(!item)return;const max=maxFor(item),next=Number(item.quantity||1)+change;if(next<1)return;if(next>max){warning.innerHTML='<div class="warning">Quantidade máxima disponível para esta peça: '+max+'.</div>';return}item.quantity=next;item.stock=max;saveCart(cart);warning.innerHTML='';render()}function removeItem(index){const cart=normalizeCart(getCart());cart.splice(index,1);saveCart(cart);warning.innerHTML='';render()}
function render(){const cart=normalizeCart(getCart());if(JSON.stringify(cart)!==JSON.stringify(getCart()))saveCart(cart);items.innerHTML='';const units=cart.reduce((s,x)=>s+Number(x.quantity||1),0);cartPill.textContent=units+' '+(units===1?'item':'itens');if(!cart.length){empty.style.display='block';summary.style.display='none';return}empty.style.display='none';summary.style.display='block';let total=0;cart.forEach((item,index)=>{const q=Number(item.quantity||1),price=Number(item.price||0),max=maxFor(item);total+=price*q;const row=document.createElement('div');row.className='item';row.innerHTML=(item.image?'<img src="'+item.image+'" alt="'+String(item.name||'Peça RSMF').replace(/"/g,'&quot;')+'">':'<div></div>')+'<div><h2>'+String(item.name||item.slug||'Peça RSMF')+'</h2><div class="unit">'+brl(price)+' por unidade</div><div class="lineprice">'+brl(price*q)+'</div><div class="stocknote">'+max+' em estoque</div></div><div class="controls-wrap"><div class="controls"><button class="qtybtn" type="button" data-minus="'+index+'" aria-label="Diminuir quantidade">−</button><span class="qty">'+q+'</span><button class="qtybtn" type="button" data-plus="'+index+'" '+(q>=max?'disabled':'')+' aria-label="Aumentar quantidade">+</button></div><button class="remove" type="button" data-remove="'+index+'">Remover</button></div>';items.appendChild(row)});subtotal.textContent=brl(total)}
document.addEventListener('click',e=>{if(e.target.dataset.minus!==undefined)changeQuantity(Number(e.target.dataset.minus),-1);if(e.target.dataset.plus!==undefined)changeQuantity(Number(e.target.dataset.plus),1);if(e.target.dataset.remove!==undefined)removeItem(Number(e.target.dataset.remove))});checkout.addEventListener('click',e=>{if(!getCart().length)e.preventDefault()});render();syncStock();
</script></body></html>
