<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrinho · RSMF Cerâmica</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ee;color:#171717;font-family:Arial,sans-serif}
header{padding:24px 20px;border-bottom:1px solid #ddd8cf;background:#fff}
header a{color:#171717;text-decoration:none}
main{max-width:900px;margin:auto;padding:32px 20px}
h1{margin:0 0 28px;font-size:32px}
#empty{display:none;padding:40px 0;text-align:center}
.item{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #d7d2c8}
.item img{width:100px;height:100px;object-fit:cover;background:#ddd}
.item h2{font-size:18px;margin:0 0 8px}
.price{font-weight:bold}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px}
button{border:1px solid #222;background:#fff;padding:8px 12px;cursor:pointer}
.remove{border:0;padding:0;color:#666;text-decoration:underline}
.summary{margin-top:30px;padding:24px;background:#fff}
.total{display:flex;justify-content:space-between;font-size:21px;font-weight:bold}
.checkout{display:block;margin-top:20px;padding:15px;text-align:center;background:#171717;color:#fff;text-decoration:none}
@media(max-width:600px){
.item{grid-template-columns:80px 1fr}
.item img{width:80px;height:80px}
.item-total{grid-column:2}
}
</style>
</head>
<body>

<header>
<a href="/">← Continuar comprando</a>
</header>

<main>
<h1>Seu carrinho</h1>

<div id="items"></div>

<div id="empty">
<p>Seu carrinho está vazio.</p>
<a href="/">Ver peças disponíveis</a>
</div>

<div class="summary" id="summary">
<div class="total">
<span>Subtotal</span>
<span id="subtotal">R$ 0,00</span>
</div>
<a class="checkout" href="#" id="checkout">Continuar para entrega</a>
</div>
</main>
